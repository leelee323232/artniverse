name: Deploy Demo to SiteGround

on:
  push:
    branches:
      - frontend-dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: ./front
        run: npm ci
      
      - name: Build
        working-directory: ./front
        run: npm run build

      - name: Deploy to SiteGround
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SITEGROUND_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SITEGROUND_HOST }}
          REMOTE_USER: ${{ secrets.SITEGROUND_USER }}
          REMOTE_PORT: ${{ secrets.SITEGROUND_PORT }}
          SOURCE: "frontend/out/"
          TARGET: "/home/customer/www/demoart.artniverse.com/public_html/"
          ARGS: "-rlgoDzvc --delete"
